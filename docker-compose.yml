version: '3.9'
services:
  cloudkitchen-mvc:
    image: salamaattia/cloudkitchen-mvc:0.0.2.RELEASE
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - cloudkitchen-db
    networks:
      - cloud-kitchen-network 

  cloudkitchen-db:
    image: salamaattia/cloudkitchen-db:0.0.2.RELEASE
    ports:
      - "5432:5432"
    restart: always
    networks:
      - cloud-kitchen-network  
      
networks:
  cloud-kitchen-network: 